# Runs that fail with the baseline debug build (-O0 -g -fcheck=all
# -ffpe-trap=invalid,zero,overflow). For each, test_debug_build.py requires
# (1) the debug build to fail with an error matching 'match' (regex on the
#     failure message incl. the stderr tail) -- once the refactor fixes it,
#     the test fails ("DID NOT RAISE") and this list must be updated;
# (2) the same run to finish cleanly with all checks except bounds
#     (-fcheck=all,no-bounds), so new FP traps etc. in these paths are caught.
# Line numbers refer to baseline v2.1.0.
# What qualifies for this list and how to add or remove an entry:
# tests/README.md, 'Rules'.
