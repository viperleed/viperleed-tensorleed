[pytest]
testpaths = .
markers =
    tier1: program-level regression tests (no viperleed)
    tier2: end-to-end tests through viperleed
    perf: CPU-time / peak-memory A/B comparison against the baseline
    debug: runs with the debug build (bounds checks, FP traps)
    benchmark: large-system benchmark (slow, opt-in)
    unit: tests of the harness itself (auto-marked, also tier1)
    xdist_group: pytest -n: tests of one group run on the same worker
addopts = -m "not perf and not debug and not benchmark and not tier2"
