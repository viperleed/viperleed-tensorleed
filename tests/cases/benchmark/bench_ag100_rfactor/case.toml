# Generated by tests/generate/rfactor_inputs.py (build_benchmark_case); inputs/ is not committed,
# the benchmark tests generate it at test time
program = "rfactor"
description = "Ag(100)-derived rfactor with 100 experimental and 120 theory beams, 50 geometries, benchmark"
covers = ["benchmark"]

[[runs]]
name = "nb100_t120_ns50"
stdin = "inputs/spectrum"
param = "inputs/PARAM"
files = { WEXPEL = "inputs/WEXPEL_nb100_t120_ns50" }
outputs = ["ROUT", "ROUTSHORT", "exp.column", "theo.column", "stdout"]
