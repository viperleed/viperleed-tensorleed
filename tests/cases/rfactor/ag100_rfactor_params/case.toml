# Generated by tests/generate/make_hand_cases.py
program = "rfactor"
description = "Ag(100) rfactor input parameters, one run each: a theory beam without experimental counterpart (KAV = 0), all four R-factor weights, smoothing with a gap, only fractional beams (MITTEL = 2), IPR = 2 with smoothing, gaps in three beams, a detected gap at the upper end of the data, gaps below the start of the theory with R2 and with all weights, a gap near the end of the theory with all weights, no overlap with the theory; CPC 2001 Table 7 covers KAV, ISMOTH, MITTEL and IPR, not KAV = 0, WR or gaps"
